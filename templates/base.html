<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Building Management{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="name">Building Ledger</span>
        <span class="tag">Management console</span>
      </div>
      <nav>
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if active == 'dashboard' else '' }}"><span class="dot"></span> Dashboard</a>
        <a href="{{ url_for('settings_page') }}" class="{{ 'active' if active == 'settings' else '' }}"><span class="dot"></span> Settings</a>
        <a href="{{ url_for('payments_page') }}" class="{{ 'active' if active == 'payments' else '' }}"><span class="dot"></span> Payments</a>
        <a href="{{ url_for('water_page') }}" class="{{ 'active' if active == 'water' else '' }}"><span class="dot"></span> Water Bill</a>
        <a href="{{ url_for('expenses_page') }}" class="{{ 'active' if active == 'expenses' else '' }}"><span class="dot"></span> Expenses</a>
        <a href="{{ url_for('report_page') }}" class="{{ 'active' if active == 'report' else '' }}"><span class="dot"></span> Report</a>
      </nav>
    </aside>
    <main class="main">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
