{% extends "base.html" %}
{% block title %}Edit Expense — Building Management{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Edit Expense</h1>
    <div class="sub">Expense #{{ expense.id }}</div>
  </div>
</div>

<div class="panel">
  <div class="panel-body">
    <form method="POST" action="{{ url_for('update_expense_route', expense_id=expense.id) }}">
      <div class="form-grid">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" value="{{ expense.title }}" required>
        </div>
        <div class="field">
          <label for="amount">Amount</label>
          <input type="number" min="0" step="0.01" id="amount" name="amount" value="{{ expense.amount }}" required>
        </div>
        <div class="field">
          <label for="expense_date">Date</label>
          <input type="text" id="expense_date" name="expense_date" value="{{ expense.expense_date }}" pattern="\d{4}-\d{2}-\d{2}" required>
          <div class="hint">Jalali calendar, format YYYY-MM-DD</div>
        </div>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn">Save changes</button>
        <a href="{{ url_for('expenses_page') }}" class="btn secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
