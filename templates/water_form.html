{% extends "base.html" %}
{% block title %}Edit Water Bill — Building Management{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Edit Water Bill</h1>
    <div class="sub">Bill #{{ bill.id }} — shares are recalculated automatically on save</div>
  </div>
</div>

<div class="panel">
  <div class="panel-body">
    <form method="POST" action="{{ url_for('update_water_bill_route', water_bill_id=bill.id) }}">
      <div class="form-grid">
        <div class="field">
          <label for="bill_month">Bill month</label>
          <input type="text" id="bill_month" name="bill_month" value="{{ bill.bill_month }}" required>
        </div>
        <div class="field">
          <label for="total_amount">Total amount</label>
          <input type="number" min="0" step="0.01" id="total_amount" name="total_amount" value="{{ bill.total_amount }}" required>
        </div>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn">Save and recalculate</button>
        <a href="{{ url_for('water_page') }}" class="btn secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
